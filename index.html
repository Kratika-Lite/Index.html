<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root{--bg:#070b10;--panel:#0d141c;--line:#1b2a38;--tx:#cfe6ee;--dim:#6f8a97;--ac:#22d3ee;--bad:#ff4d5e;--ok:#34d399;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-t=red]{--ac:#ff4d5e}:root[data-t=matrix]{--ac:#39ff14;--bg:#020602;--panel:#061006;--line:#12331a}:root[data-t=ultra]{--bg:#000;--panel:#050505;--line:#161616}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 "Share Tech Mono",ui-monospace,Menlo,Consolas,monospace}
body.crt::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 1px,transparent 1px 3px)}
header{padding:18px 16px 6px;max-width:960px;margin:auto}
h1{margin:0;font-size:26px;letter-spacing:.14em;color:var(--ac);text-shadow:0 0 14px color-mix(in srgb,var(--ac) 50%,transparent)}
.sub{color:var(--dim);font-size:13px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;max-width:960px;margin:auto}
nav button{flex:none;background:var(--panel);color:var(--dim);border:1px solid var(--line);padding:8px 12px;border-radius:4px;font:inherit;cursor:pointer}
nav button.on{color:var(--ac);border-color:var(--ac)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;margin:0 0 14px}

input,textarea{width:100%;background:#000;color:var(--tx);border:1px solid var(--line);border-radius:4px;padding:10px;font:inherit}
input:focus,button:focus-visible,textarea:focus{outline:2px solid var(--ac);outline-offset:1px}
.btn{background:var(--ac);color:#001318;border:0;padding:9px 14px;border-radius:4px;font:inherit;font-weight:700;cursor:pointer;margin:6px 6px 0 0}

.bar{height:10px;background:#000;border:1px solid var(--line);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);transition:width .4s}

.term{background:#000;border:1px solid var(--line);border-radius:6px;padding:12px;min-height:220px;max-height:340px;overflow:auto}

.clue.sel{border-color:var(--ac)}
.badge{display:inline-block;border:1px solid var(--line);padding:6px 10px;border-radius:4px;margin:0 6px 6px 0}.badge.on{border-color:var(--ac);color:var(--ac)}
label.ck{display:block;padding:6px 0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ac);color:#001318;padding:8px 14px;border-radius:4px;display:none;font-weight:700;z-index:9}
#intro{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity .7s}
#intro.out{opacity:0;pointer-events:none}#intro h1{font-size:clamp(34px,10vw,68px);margin:8px 0}#intro p{max-width:460px}
.rev{opacity:0;transform:translateY(24px);transition:opacity .6s,transform .6s}.rev.in{opacity:1;transform:none}
.cred a{color:var(--ac)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.rev{opacity:1;transform:none}}
.cv{width:100%;height:230px;display:block;touch-action:pan-y}.tile{transition:transform .15s}body.focus nav{display:none}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script></head><body>
<header><h1>CYBERGUARD X</h1><div class="sub">PhishLayer Edition — a cybersecurity learning lab. Everything runs on your device.</div></header>
<nav id="nav"></nav><main id="app"></main><div id="toast"></div>
<div id="intro"><div id="ci" class="cv" style="width:min(320px,80vw);height:230px"></div><div class="sub">PHISHLAYER EDITION</div><h1>CYBERGUARD X</h1><p>Spot phishing, protect your passwords and think like a defender.</p><p class="dim">Built for every learner online, made by Kratika Kushwaha</p><button class="btn" onclick="enter()">Enter the lab</button></div>
<script>
const $=s=>document.querySelector(s);
let S={xp:0,done:{},streak:0,last:"",theme:"cyan",crt:false,calm:false,checks:{},quiz:0,cases:0,phish:0,q:0};
try{const r=localStorage.getItem("cgx");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem("cgx",JSON.stringify(S))}catch(e){}};
const toast=m=>{const t=$("#toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",1800)};
function xp(n,key){if(key){if(S.done[key])return;S.done[key]=1}S.xp+=n;toast("+"+n+" XP");save()}
function applyTheme(){document.documentElement.dataset.t=S.theme;document.body.classList.toggle("crt",S.crt)}
const today=new Date().toISOString().slice(0,10);
if(S.last!==today){const y=new Date(Date.now()-864e5).toISOString().slice(0,10);S.streak=S.last===y?S.streak+1:1;S.last=today;save()}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tabs=[["home","🏠 Command"],["phish","🎣 PhishLayer"],["pass","🔐 Passwords"],["hash","#️⃣ Hash Lab"],["detect","🕵️ Detective"],["quiz","🎯 Quiz"],["net","🌐 Network"],["ciph","🔑 Ciphers"],["learn","🧠 Academy"],["term","🖥️ Terminal"],["priv","🔒 Privacy"],["me","🏅 Profile"]];
let cur="home";
function nav(){$("#nav").innerHTML=tabs.map(t=>`<button class="${t[0]===cur?"on":""}" onclick="go('${t[0]}')">${t[1]}</button>`).join("")}
function go(t){cur=t;nav();$("#app").innerHTML="";V[t]();credits();reveal();tilt();{const h=$("#c3");if(h)scene(h,"net")}window.scrollTo(0,0)}
const lvl=()=>Math.floor(S.xp/100)+1;
const tips=["Never enter passwords through suspicious links.","Use a unique password for every account.","Turn on MFA when it is available.","Read the domain carefully, right to left before the first slash.","Don't install software from unknown sources.","Urgency is a tactic. Slow down before you click."];
const missions=["Analyze two training URLs in PhishLayer","Score 3 or more in the Quiz","Solve one Detective case","Compare two hashes in the Hash Lab"];
const V={};
V.home=()=>{const d=new Date().getDate();$("#app").innerHTML=`
<div class="card" style="padding:0;overflow:hidden"><div id="c3" class="cv"></div></div><div class="card"><h2>Security status: TRAINING MODE ACTIVE</h2><div class="dim">All modules online. No data leaves this device.</div>
<h3>Level ${lvl()} — ${S.xp%100}/100 XP</h3><div class="bar"><i style="width:${S.xp%100}%"></i></div>
<div class="dim">🔥 Streak: ${S.streak} day${S.streak>1?"s":""}</div></div>
<div class="grid"><div class="card"><h3>🎯 Daily mission</h3>${missions[d%missions.length]}</div>
<div class="card"><h3>🧠 Tip of the day</h3>${tips[d%tips.length]}</div></div>
<div class="grid">${tabs.slice(1).map(t=>`<div class="card tile" onclick="go('${t[0]}')"><b>${t[1]}</b></div>`).join("")}</div>`+tour()};
/* PHISH */
const WORDS=["login","verify","secure","account","update","password","bank","confirm","urgent","suspend","wallet"];
function analyze(u){let s=u.trim();if(!s)return null;const r=[];let url;
try{url=new URL(/^[a-z]+:\/\//i.test(s)?s:"https://"+s)}catch(e){return{err:"That does not look like a valid URL."}}
const h=url.hostname,full=url.href;
r.push(url.protocol==="https:"?[1,"HTTPS detected (encrypted, but not proof of trust)"]:[0,"No HTTPS: the connection is not encrypted"]);
if(full.length>75)r.push([0,"Very long URL"]);
if(/^\d{1,3}(\.\d{1,3}){3}$/.test(h))r.push([0,"IP address used instead of a domain name"]);
if(s.includes("@"))r.push([0,"Contains an @ symbol, which can hide the real destination"]);
const w=WORDS.filter(x=>full.toLowerCase().includes(x));if(w.length)r.push([0,"Suspicious security-related words: "+w.join(", ")]);
if(h.split(".").length>4)r.push([0,"Many subdomains, so the real domain may be hidden"]);
if((h.match(/-/g)||[]).length>2)r.push([0,"Unusual formatting: many hyphens"]);
if(h.includes("xn--"))r.push([0,"Punycode hostname, which can imitate look-alike characters"]);
if(!/^[a-z0-9.-]+\.[a-z0-9-]{2,}$/i.test(h)&&!/^\d/.test(h))r.push([0,"Hostname looks invalid"]);
return{r,n:r.filter(x=>!x[0]).length}}
const TRAIN=["https://example.test/login","http://secure-account.example.test","http://192.168.4.7/verify/account","https://login.verify.secure.bank.example.test/update?id=88231","https://example.test"];
V.phish=()=>{$("#app").innerHTML=`<div class="card"><h2>URL Analyzer</h2><div class="dim">Teaches warning signs. It cannot prove a link is safe or malicious.</div>
<input id="u" placeholder="https://example.test/login" aria-label="URL"><button class="btn" onclick="runU()">Analyze</button><div id="ur"></div></div>
<div class="card"><h2>Safe URL Playground</h2><div class="dim">Fictional training links. Tap to analyze.</div>${TRAIN.map((t,i)=>`<button class="clue" onclick="$('#u').value=TRAIN[${i}];runU()">${t}</button>`).join("")}</div>
<div class="card"><h2>Phishing Simulator (safe)</h2><div id="sim"></div></div>`;simShow()};
function runU(){const a=analyze($("#u").value),o=$("#ur");if(!a)return;if(a.err){o.innerHTML=`<p class="bad">${a.err}</p>`;return}
o.innerHTML=`<h3 class="${a.n?"bad":"ok"}">${a.n?"🔴 WARNING SIGNS DETECTED":"✓ ANALYSIS COMPLETE — no obvious warning signs"}</h3>${a.r.map(x=>`<div class="${x[0]?"ok":"bad"}">${x[0]?"✓":"⚠"} ${esc(x[1])}</div>`).join("")}<p>Risk indicators: <b>${a.n}</b></p>`;xp(5,"url"+esc($("#u").value).slice(0,40))}
const SIMS=[{m:"From: support@paypa1-alerts.example.test\nSubject: URGENT!!! Account locked\n\nYour account will be closed in 10 minutes. Confirm your password here: http://paypa1-verify.example.test",t:0,e:"Fake urgency, look-alike sender (paypa1 with a number 1), a strange link, and a password request."},
{m:"From: hr@yourcompany.example.test\nSubject: Team lunch Friday\n\nHi all, lunch is at 1pm in the cafeteria. Let me know about dietary needs by Thursday.",t:1,e:"Expected sender, no link, no attachment, no pressure, and no request for secrets."},
{m:"From: delivery@parcel-track.example.test\nSubject: Package on hold\n\nYou did not order anything? Download the attached invoice.zip to cancel the charge.",t:0,e:"Unexpected attachment, scare tactic, and a zip file that could hide malware."}];
function simShow(){const s=SIMS[S.q%SIMS.length];$("#sim").innerHTML=`<pre class="card" style="background:#000">${esc(s.m)}</pre><b>Would you trust this message?</b><br><button class="btn" onclick="simAns(1)">Trust it</button><button class="btn g" onclick="simAns(0)">Don't trust it</button><div id="sr"></div>`}
function simAns(a){const s=SIMS[S.q%SIMS.length],ok=a===s.t;$("#sr").innerHTML=`<p class="${ok?"ok":"bad"}">${ok?"✓ Correct.":"✗ Not quite."} ${s.e}</p><button class="btn g" onclick="S.q++;save();simShow()">Next message</button>`;if(ok){S.phish++;xp(10)}}
/* PASSWORD */
function strength(p){let sc=0,n=[];if(p.length>=12)sc+=3;else if(p.length>=8)sc+=1;else n.push("Too short");if(p.length>=16)sc+=1;
const v=[/[a-z]/,/[A-Z]/,/\d/,/[^A-Za-z0-9]/].filter(r=>r.test(p)).length;sc+=v;if(v<3)n.push("Low character variety");
if(/(.)\1{2,}/.test(p)){sc-=2;n.push("Repeated characters")}
if(/(0123|1234|2345|3456|abcd|bcde|qwer|asdf)/i.test(p)){sc-=2;n.push("Sequential characters")}
if(/password|admin|welcome|letmein|iloveyou|qwerty|123456/i.test(p)){sc-=4;n.push("Common password pattern")}
return{sc:Math.max(0,Math.min(10,sc)),n}}
V.pass=()=>{$("#app").innerHTML=`<div class="card"><h2>Password Strength Meter</h2><div class="dim">Nothing you type is stored or sent anywhere.</div>
<input id="pw" type="password" autocomplete="off" placeholder="Type a practice password" oninput="pwc()"><div class="bar" style="margin-top:10px"><i id="pb" style="width:0"></i></div><div id="pt"></div></div>
<div class="card"><h2>Password Education</h2><p><b>Length wins.</b> Each extra character multiplies the guesses an attacker needs. A long phrase beats a short complex string.</p><p><b>Never reuse.</b> When one site leaks, attackers try the same password everywhere.</p><p><b>Unique passwords</b> contain the damage to one account. A password manager remembers them for you.</p><p><b>MFA/2FA</b> adds a second proof, such as a code or key, so a stolen password alone is not enough.</p></div>
<div class="card"><h2>Practice Generator</h2><button class="btn" onclick="gen()">Generate example</button><pre id="gp" style="margin-top:10px"></pre></div>`};
function pwc(){const p=$("#pw").value,r=strength(p),l=["VERY WEAK","VERY WEAK","WEAK","WEAK","FAIR","FAIR","GOOD","GOOD","STRONG","STRONG","EXCELLENT"][r.sc];
$("#pb").style.width=r.sc*10+"%";$("#pb").style.background=r.sc<4?"var(--bad)":r.sc<7?"#fbbf24":"var(--ok)";
$("#pt").innerHTML=p?`<b>${l}</b><div class="dim">${r.n.join(" · ")||"Good length and variety, no obvious patterns"}</div>`:"";if(r.sc>=8)xp(20,"pw")}
function gen(){const c="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%&*",a=new Uint32Array(16);crypto.getRandomValues(a);$("#gp").textContent=[...a].map(x=>c[x%c.length]).join("");xp(5,"gen")}
/* HASH */
async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
V.hash=()=>{$("#app").innerHTML=`<div class="card"><h2>SHA-256 Generator</h2><input id="hi" value="Hello CyberGuard" oninput="hl()"><pre id="ho" class="ok" style="margin-top:10px"></pre>
<p class="dim">A hash is a one-way fingerprint: easy to compute, practically impossible to reverse. Systems use hashes to check file integrity and to store passwords without keeping the passwords themselves.</p></div>
<div class="card"><h2>Hash Challenge</h2><div class="dim">Change one letter and watch every character change.</div>
<input id="ha" value="CyberGuard" oninput="hc()" style="margin-bottom:8px"><input id="hb" value="Cyberguard" oninput="hc()"><pre id="hr" style="margin-top:10px"></pre></div>`;hl();hc()};
async function hl(){$("#ho").textContent=await sha($("#hi").value)}
async function hc(){const a=await sha($("#ha").value),b=await sha($("#hb").value);let d=0;
const hb=[...b].map((c,i)=>{if(c!==a[i]){d++;return`<span class="bad">${c}</span>`}return c}).join("");
$("#hr").innerHTML=`A: ${a}\nB: ${hb}\n\n${a===b?"Hashes are identical (same input).":`<b>${d} of 64 characters differ.</b> Tiny change, completely different hash.`}`;if(a!==b)xp(15,"hash")}
/* DETECTIVE */
const CASES=[{t:"The Locked Account",s:"A student gets an email saying their account will be locked in 10 minutes.",c:[["Sender: security-alert@example.test",1,"Generic alert address, not the school's known domain."],["Link: example.test/account.verify-now",1,"The link asks you to verify on a page you were pushed to."],["Message: URGENT!!! Act in 10 minutes",1,"Fake urgency is a classic pressure tactic."],["Greeting uses your real full name",0,"Not a red flag alone. Attackers can find names easily, so it proves nothing."],["Footer has an unsubscribe link",0,"Normal for many emails. Judge the rest first."]]},
{t:"The Free Gift Card",s:"A friend's account sends you a message with a prize link.",c:[["Message: 'OMG is this you in this video??'",1,"Curiosity bait sent from a hijacked account."],["Link: http://192.168.0.9/video",1,"Raw IP address and no HTTPS."],["Sent at your usual chat time",0,"Timing alone does not tell you anything."],["Asks you to log in again to view",1,"Requests for credentials through a link are a top warning sign."]]}];
let cs=0,pick={};
V.detect=()=>{const c=CASES[cs];pick={};$("#app").innerHTML=`<div class="card"><h2>Case ${cs+1}: ${c.t}</h2><p>${c.s}</p><div class="dim">Tap every clue that looks suspicious, then solve.</div>
${c.c.map((x,i)=>`<button class="clue" id="cl${i}" onclick="pick[${i}]=!pick[${i}];this.classList.toggle('sel')">${esc(x[0])}</button>`).join("")}
<button class="btn" onclick="solve()">🧩 Solve case</button><div id="cr"></div></div>`};
function solve(){const c=CASES[cs];let right=0,wrong=0;const out=c.c.map((x,i)=>{const p=!!pick[i],ok=p===!!x[1];ok?right++:wrong++;return`<div class="${ok?"ok":"bad"}">${ok?"✓":"✗"} ${esc(x[0])}<div class="dim">${x[2]}</div></div>`}).join("");
const win=wrong===0;$("#cr").innerHTML=`<h3>${win?"CASE SOLVED":"Case needs another look"}</h3>${out}<button class="btn g" onclick="${win?"cs=(cs+1)%CASES.length;":""}go('detect')">${win?"Next case":"Try again"}</button>`;if(win){S.cases++;xp(25,"case"+cs)}}
/* QUIZ */
const Q=[["What does HTTPS help provide?",["A guarantee a site is trustworthy","Encrypted communication","Malware protection","Password recovery"],1,"HTTPS encrypts traffic in transit. Phishing sites can use it too."],
["Which is the biggest warning sign?",["Unexpected password request","Normal greeting","Company logo","Regular email signature"],0,"Logos and signatures are easy to copy. Asking for a password is the real danger."],
["True or false: a long unique passphrase is stronger than a short complex password.",["True","False"],0,"Length adds far more guesses than swapping letters for symbols."],
["What does MFA add?",["A second proof of identity","A faster login","A longer password","Antivirus"],0,"A stolen password alone will not be enough."],
["You get an unexpected .zip invoice from a stranger. Best move?",["Open it to check","Forward it to friends","Delete or report it without opening","Reply asking who they are"],2,"Unexpected attachments are a common malware route."],
["Changing one letter of an input changes a SHA-256 hash...",["Slightly","Completely","Not at all","Only the last digits"],1,"This is the avalanche effect."],
["Which link is the most suspicious?",["https://example.test/login","http://192.168.4.7/verify","https://example.test","https://example.test/help"],1,"IP address, no HTTPS, and a 'verify' path."],
["What is social engineering?",["Hacking a router","Tricking people into unsafe actions","A type of firewall","Encrypting files"],1,"It targets human trust rather than software."]];
let qi=0,qk=0,qp=[],GOAL=5;
function qEnd(){document.body.classList.remove("focus");onbeforeunload=null}
V.quiz=()=>{$("#app").innerHTML=`<div class="card"><h2>Streak Mission</h2><p>Answer <b>${GOAL} questions in a row</b> correctly. One wrong answer resets your streak. The mission stays open, and the browser warns you before closing the tab, until you finish and press Exit.</p><button class="btn" onclick="qStart()">Start mission</button></div>`};
function qStart(){qp=Q.map((_,i)=>i).sort(()=>Math.random()-.5);qi=0;qk=0;document.body.classList.add("focus");onbeforeunload=e=>{e.preventDefault();return""};qShow()}
function qLeave(){if(confirm("Leave the mission? Your streak will be lost.")){qEnd();go("quiz")}}
function qShow(){const q=Q[qp[qi%qp.length]];$("#app").innerHTML=`<div class="card"><div class="dim">STREAK ${qk} / ${GOAL}</div><div class="bar"><i style="width:${qk/GOAL*100}%"></i></div><h2 style="margin-top:12px">${q[0]}</h2>${q[1].map((o,i)=>`<button class="clue" onclick="qa(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join("")}<div id="qr"></div><button class="btn g" onclick="qLeave()">Leave mission</button></div>`}
function qa(i){const q=Q[qp[qi%qp.length]],ok=i===q[2];if(ok)qk++;else qk=0;document.querySelectorAll(".clue").forEach((b,j)=>{b.disabled=true;if(j===q[2])b.style.borderColor="var(--ok)";else if(j===i)b.style.borderColor="var(--bad)"});
const w=qk>=GOAL;if(w){S.quiz++;xp(50)}
$("#qr").innerHTML=`<p class="${ok?"ok":"bad"}">${ok?"✓ Correct.":"✗ Incorrect. Streak reset."} ${q[3]}</p>`+(w?`<h3 class="ok">MISSION COMPLETE</h3><button class="btn" onclick="qEnd();go('home')">Exit to Command Center</button>`:`<button class="btn" onclick="qi++;qShow()">Next</button>`)}
const PORTS=[[22,"SSH","secure remote login"],[53,"DNS","turns names into IPs"],[80,"HTTP","web, not encrypted"],[443,"HTTPS","web, encrypted"],[25,"SMTP","sending email"],[3389,"RDP","remote desktop, often attacked"]];
V.net=()=>{$("#app").innerHTML=`<div class="card"><h2>Subnet Calculator</h2><div class="dim">Enter an IPv4 address and a CIDR prefix.</div><input id="ip" value="192.168.1.77" oninput="sn(1)" style="margin-bottom:8px"><input id="cd" type="number" min="1" max="30" value="24" oninput="sn(1)"><pre id="so" style="margin-top:10px"></pre></div><div class="card"><h2>Common Ports</h2>${PORTS.map(p=>`<div><b class="ok">${p[0]}</b> ${p[1]}<span class="dim"> — ${p[2]}</span></div>`).join("")}</div>`;sn()};
function sn(q){const ip=$("#ip").value.trim().split("."),c=+$("#cd").value,o=$("#so");if(ip.length!==4||ip.some(x=>x===""||isNaN(x)||x<0||x>255)||!(c>=1&&c<=30)){o.innerHTML='<span class="bad">Enter a valid IPv4 address and a prefix from 1 to 30.</span>';return}
const n=((ip[0]<<24)|(ip[1]<<16)|(ip[2]<<8)|+ip[3])>>>0,m=(0xFFFFFFFF<<(32-c))>>>0,net=(n&m)>>>0,bc=(net|~m)>>>0,f=x=>[x>>>24,(x>>16)&255,(x>>8)&255,x&255].join(".");
o.textContent=`Network:      ${f(net)}\nMask:         ${f(m)}\nBroadcast:    ${f(bc)}\nFirst host:   ${f(net+1)}\nLast host:    ${f(bc-1)}\nUsable hosts: ${Math.pow(2,32-c)-2}`;if(q)xp(10,"sn")}
V.ciph=()=>{$("#app").innerHTML=`<div class="card"><h2>Caesar Cipher</h2><input id="ct" value="Hello CyberGuard" oninput="cz(1)"><label class="ck">Shift: <b id="sv">3</b><input id="cs" type="range" min="1" max="25" value="3" oninput="cz(1)"></label><pre id="co" class="ok"></pre><div class="dim">Each letter moves along the alphabet. Only 25 shifts exist, so it is easy to crack. Challenge: find the shift that turns "Khoor" into a real word.</div></div><div class="card"><h2>Base64</h2><div class="dim">Encoding is not encryption. Anyone can reverse it.</div><input id="bt" value="CyberGuard" oninput="bz(1)"><pre id="bo" style="margin-top:8px"></pre></div>`;cz();bz()};
function cz(q){const k=+$("#cs").value;$("#sv").textContent=k;$("#co").textContent=$("#ct").value.replace(/[a-z]/gi,c=>{const b=c<"a"?65:97;return String.fromCharCode((c.charCodeAt(0)-b+k)%26+b)});if(q)xp(10,"cz")}
function bz(q){const v=$("#bt").value;let e="";try{e=btoa(unescape(encodeURIComponent(v)))}catch(x){}$("#bo").textContent="Encoded: "+e+"\nDecoded back: "+v;if(q)xp(10,"bz")}
function tilt(){document.querySelectorAll(".tile").forEach(t=>{t.onpointermove=e=>{const r=t.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;t.style.transform=`perspective(600px) rotateY(${x*14}deg) rotateX(${-y*14}deg) scale(1.03)`};t.onpointerleave=()=>{t.style.transform=""}})}
function scene(el,kind){if(!window.THREE||!el)return;const T=THREE,W=el.clientWidth||320,H=el.clientHeight||230,col=new T.Color(getComputedStyle(document.documentElement).getPropertyValue("--ac").trim()||"#22d3ee");
const r=new T.WebGLRenderer({antialias:true,alpha:true});r.setSize(W,H);r.setPixelRatio(Math.min(devicePixelRatio,2));el.innerHTML="";el.appendChild(r.domElement);
const sc=new T.Scene(),cam=new T.PerspectiveCamera(50,W/H,.1,50),g=new T.Group(),P=[];cam.position.z=kind==="net"?7:4.2;sc.add(g);let pulse=null;
if(kind==="shield"){g.add(new T.LineSegments(new T.WireframeGeometry(new T.IcosahedronGeometry(1.5,1)),new T.LineBasicMaterial({color:col})));g.add(new T.Mesh(new T.OctahedronGeometry(.7),new T.MeshBasicMaterial({color:col,wireframe:true})))}
else{for(let i=0;i<26;i++)P.push(new T.Vector3((Math.random()-.5)*7,(Math.random()-.5)*3.6,(Math.random()-.5)*4));
P.forEach(p=>{const m=new T.Mesh(new T.SphereGeometry(.07,8,8),new T.MeshBasicMaterial({color:col}));m.position.copy(p);g.add(m)});
const L=[];P.forEach((a,i)=>P.forEach((b,j)=>{if(j>i&&a.distanceTo(b)<2.4)L.push(a,b)}));g.add(new T.LineSegments(new T.BufferGeometry().setFromPoints(L),new T.LineBasicMaterial({color:col,transparent:true,opacity:.35})));
pulse=new T.Mesh(new T.SphereGeometry(.14,10,10),new T.MeshBasicMaterial({color:0xff4d5e}));g.add(pulse)}
let mx=0,my=0,t=0;el.onpointermove=e=>{const b=el.getBoundingClientRect();mx=(e.clientX-b.left)/b.width-.5;my=(e.clientY-b.top)/b.height-.5};
const calm=S.calm||matchMedia("(prefers-reduced-motion:reduce)").matches;
function f(){if(!el.isConnected){r.dispose();return}t+=.01;g.rotation.y=t*.6+mx;g.rotation.x=my*.8+(kind==="shield"?t*.3:0);
if(pulse){const k=t*1.5,a=P[Math.floor(k)%P.length],b=P[(Math.floor(k)+1)%P.length];pulse.position.lerpVectors(a,b,k%1)}
r.render(sc,cam);if(!calm)requestAnimationFrame(f)}f()}
/* ACADEMY + GLOSSARY */
const LES=[["Level 1: What is cybersecurity?","Protecting devices, accounts and data from misuse, theft and damage."],["Level 1: What is phishing?","Messages that imitate trusted senders to trick you into giving up information or clicking something unsafe."],["Level 1: What is malware?","Software built to cause harm, such as viruses, trojans and ransomware."],["Level 2: Authentication","Proving who you are with something you know, have or are. Combining them is MFA."],["Level 2: Encryption","Scrambling data so only someone with the key can read it."],["Level 2: Social engineering","Manipulating trust, fear or urgency instead of breaking technology."],["Level 3: Threat modeling","Asking what you are protecting, who might attack it, how, and what to do about it."]];
const GL={Phishing:"Social engineering where someone tries to trick you into revealing information or taking an unsafe action.",Malware:"Software designed to damage or gain unauthorized access to systems.",Firewall:"A filter that allows or blocks network traffic by rules.",Hash:"A fixed-size one-way fingerprint of data.",Encryption:"Turning readable data into unreadable data using a key.",Authentication:"Verifying that someone is who they claim to be.",MFA:"Multi-factor authentication: two or more kinds of proof to log in.",VPN:"An encrypted tunnel between your device and another network.","Social engineering":"Manipulating people rather than machines.",Trojan:"Malware disguised as something useful.",Ransomware:"Malware that locks files and demands payment.",Botnet:"A network of infected devices controlled remotely.","Zero-day":"A flaw unknown to the vendor, with no fix available yet."};
